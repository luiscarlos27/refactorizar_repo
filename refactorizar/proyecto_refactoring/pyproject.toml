[project]
name = "peliculas-series"
version = "1.0.0"
description = "Aplicacion CLI de peliculas y series (OMDB + TVMaze)"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.28.0",
    "json5>=0.9.0",
    "tenacity>=8.0.0",
    "pybreaker>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.14.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "black>=24.0.0",
]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage]
fail_under = 90
omit = ["tests/*"]